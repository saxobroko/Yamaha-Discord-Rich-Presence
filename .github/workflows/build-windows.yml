name: Build Windows exe

on:
  push:
    branches:
      - cursor/navidrome-now-playing-a5d5
      - cursor/listening-presence-4cef
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean YamahaDiscordRPC.spec

      - name: Upload YamahaDiscordRPC.exe
        uses: actions/upload-artifact@v4
        with:
          name: YamahaDiscordRPC-windows
          path: dist/YamahaDiscordRPC.exe
          if-no-files-found: error
          retention-days: 14
